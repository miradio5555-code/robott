<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#151417">
  <script>
    // Тема: "light", "dark" или "auto" (как в системе). Ставим до отрисовки страницы.
    (function () {
      try {
        var th = localStorage.getItem("cc_theme");
        if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>ULA Factory</title>
  <link rel="icon" href="img/mark.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <!-- Шрифты грузятся «в фоне»: если Google Fonts недоступен (например, в Китае),
       сайт сразу покажется со шрифтами системы и не будет ждать. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css?v=20261007m">
</head>
<body>
  <!-- Пока сайт загружается — «Загрузка…». Если браузер не справился — подсказка вместо белого экрана. -->
  <div id="boot" class="boot">
    <p id="boot-text">Загрузка… / Loading…</p>
  </div>
  <script>
    (function () {
      function fail() {
        var b = document.getElementById("boot");
        if (!b) return; // сайт уже открылся
        document.getElementById("boot-text").innerHTML =
          "Страница не открылась в этом браузере.<br>Откройте ссылку в <b>Chrome</b> или <b>Safari</b>: " +
          "нажмите ⋮ или ••• вверху → «Открыть в браузере».<br><br>" +
          "This page did not open in this browser. Please open the link in Chrome or Safari.";
      }
      window.addEventListener("error", function () { setTimeout(fail, 300); });
      setTimeout(fail, 12000);
    })();
  </script>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ============ ПОДСКАЗКА: НЕ ЗАПОЛНЕН config.js ============ -->
  <main id="view-config" class="center-screen hidden">
    <div class="panel">
      <img class="logo-full" src="img/logo-full.jpg" alt="ULA Factory" width="520" height="468">
      <h1 data-i18n="config_title"></h1>
      <p id="config-text" data-i18n="config_text"></p>
    </div>
  </main>

  <!-- ============ ВХОД ============ -->
  <main id="view-login" class="center-screen hidden">
    <form id="login-form" class="panel" autocomplete="on">
      <img class="logo-full" src="img/logo-full.jpg" alt="ULA Factory" width="520" height="468">
      <h1 data-i18n="login_title"></h1>
      <p class="muted" data-i18n="login_hint"></p>

      <label class="field">
        <span data-i18n="email"></span>
        <input id="login-email" type="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span data-i18n="password"></span>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>

      <p id="login-error" class="form-error hidden" role="alert"></p>
      <button id="login-btn" class="btn btn-primary btn-block" type="submit" data-i18n="login_btn"></button>

      <!-- Вход через Google (кнопка появляется, если Google включён в Supabase) -->
      <div class="oauth hidden" data-oauth>
        <div class="or"><span data-i18n="or"></span></div>
        <button class="btn btn-block btn-google" type="button" data-google>
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span data-i18n="google_btn"></span>
        </button>
      </div>
      <p class="switch-auth"><span data-i18n="no_account"></span> <a href="#/join" data-i18n="signup_link"></a></p>
      <p class="legal-links"><a href="terms.html" target="_blank" rel="noopener" data-i18n="legal_terms"></a> · <a href="privacy.html" target="_blank" rel="noopener" data-i18n="legal_privacy"></a></p>

      <div class="lang-switch lang-center" role="group" aria-label="Language">
        <button type="button" data-lang="ru" title="Русский">RU</button>
        <button type="button" data-lang="en" title="English">EN</button>
        <button type="button" data-lang="zh" title="中文">中文</button>
      </div>
    </form>
  </main>

  <!-- ============ РЕГИСТРАЦИЯ БАЙЕРА ПО ПРИГЛАШЕНИЮ (#/join/КОД) ============ -->
  <main id="view-join" class="center-screen hidden">
    <div class="panel">
      <img class="logo-full" src="img/logo-full.jpg" alt="ULA Factory" width="520" height="468">

      <!-- проверяем приглашение -->
      <p id="join-checking" class="muted" data-i18n="loading"></p>

      <!-- приглашение недействительно -->
      <div id="join-invalid" class="hidden">
        <h1 data-i18n="join_invalid_title"></h1>
        <p class="muted" data-i18n="join_invalid_text"></p>
      </div>

      <!-- форма регистрации -->
      <form id="join-form" class="hidden" novalidate>
        <h1 data-i18n="join_title"></h1>
        <p class="muted" data-i18n="join_hint"></p>
        <label class="field"><span data-i18n="join_name"></span>
          <input id="join-name" type="text" autocomplete="name" maxlength="120" required></label>
        <label class="field"><span data-i18n="join_phone"></span>
          <input id="join-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="+996 555 123 456" required>
          <p class="field-hint" data-i18n="cd_phone_hint"></p></label>
        <label class="field"><span data-i18n="join_ws"></span>
          <input id="join-ws" type="text" autocomplete="organization" maxlength="120"></label>
        <label class="field"><span data-i18n="email"></span>
          <input id="join-email" type="email" autocomplete="email" required></label>
        <label class="field"><span data-i18n="join_password"></span>
          <input id="join-password" type="password" autocomplete="new-password" minlength="8" required></label>
        <p id="join-error" class="form-error hidden" role="alert"></p>
        <button id="join-btn" class="btn btn-primary btn-block" type="submit" data-i18n="join_btn"></button>
        <div class="oauth hidden" data-oauth>
          <div class="or"><span data-i18n="or"></span></div>
          <button class="btn btn-block btn-google" type="button" data-google>
            <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            <span data-i18n="google_btn"></span>
          </button>
        </div>
        <p class="switch-auth"><span data-i18n="have_account"></span> <a href="./" data-i18n="login_btn"></a></p>
        <p class="legal-links" data-i18n="legal_agree"></p>
        <p class="legal-links"><a href="terms.html" target="_blank" rel="noopener" data-i18n="legal_terms"></a> · <a href="privacy.html" target="_blank" rel="noopener" data-i18n="legal_privacy"></a></p>
      </form>

      <!-- письмо отправлено -->
      <div id="join-done" class="hidden">
        <h1 data-i18n="join_done_title"></h1>
        <p id="join-done-text" class="muted"></p>
        <a class="btn btn-primary btn-block" href="./" data-i18n="login_btn"></a>
      </div>

      <div class="lang-switch lang-center" role="group" aria-label="Language">
        <button type="button" data-lang="ru" title="Русский">RU</button>
        <button type="button" data-lang="en" title="English">EN</button>
        <button type="button" data-lang="zh" title="中文">中文</button>
      </div>
    </div>
  </main>

  <!-- ============ КАБИНЕТ ============ -->
  <div id="view-admin" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><img class="brand-mark" src="img/mark.svg" alt="" width="36" height="36"><span class="brand-name"><b>ULA</b> Factory</span></div>
        <div class="topbar-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="ru" title="Русский">RU</button>
            <button type="button" data-lang="en" title="English">EN</button>
            <button type="button" data-lang="zh" title="中文">中文</button>
          </div>
          <!-- 💬 техподдержка (для байеров; у админа — вкладка «Поддержка») -->
          <button id="support-btn" class="icon-btn gear-btn badge-wrap buyer-only" type="button" data-i18n-title="support" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
            <span id="support-badge" class="badge hidden"></span>
            <span class="sr-only" data-i18n="support"></span>
          </button>
          <!-- ↻ обновить данные без перезагрузки страницы -->
          <button id="refresh-btn" class="icon-btn gear-btn" type="button" data-i18n-title="refresh">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button id="settings-btn" class="icon-btn gear-btn" type="button" data-i18n-title="settings" aria-haspopup="dialog">
            <!-- значок «шестерёнка» -->
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="sr-only" data-i18n="settings"></span>
          </button>
          <button id="logout-btn" class="btn btn-ghost btn-logout" type="button">
            <!-- значок «выход» (дверь со стрелкой) -->
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            <span class="logout-text" data-i18n="logout"></span>
          </button>
        </div>
        <!-- Разделы кабинета: Заказы / Клиенты -->
        <nav class="tabs" aria-label="Sections">
          <button type="button" class="tab active" data-tab="orders" aria-current="page" data-i18n="nav_orders"></button>
          <button type="button" class="tab" data-tab="clients" data-i18n="nav_clients"></button>
          <button type="button" class="tab" data-tab="calc" data-i18n="nav_calc"></button>
          <button type="button" class="tab admin-only" data-tab="buyers" data-i18n="nav_buyers"></button>
          <button type="button" class="tab admin-only" data-tab="support"><span data-i18n="nav_support"></span><span id="support-tab-badge" class="badge-inline hidden"></span></button>
        </nav>
      </div>
    </header>

    <!-- Плашка: админ смотрит чужой кабинет -->
    <div id="ws-banner" class="ws-banner hidden" role="status">
      <div class="ws-banner-inner">
        <span id="ws-banner-text"></span>
        <button id="ws-back" class="btn btn-light" type="button" data-i18n="back_to_mine"></button>
      </div>
    </div>

    <!-- ============ РАЗДЕЛ: ПОДДЕРЖКА (только админ) ============ -->
    <main id="tab-support" class="container container-narrow hidden">
      <section class="client-block">
        <h2 data-i18n="support_admin_title"></h2>
        <p class="fine-print" data-i18n="support_admin_hint"></p>
        <div id="support-threads" class="support-threads"></div>
      </section>

      <!-- уведомления о новых обращениях в Telegram -->
      <section class="client-block">
        <h2 data-i18n="tg_title"></h2>
        <p id="tg-status" class="tg-status"></p>
        <ol class="tg-steps">
          <li data-i18n="tg_step1"></li>
          <li data-i18n="tg_step2"></li>
          <li data-i18n="tg_step3"></li>
          <li data-i18n="tg_step4"></li>
        </ol>
        <button id="tg-connect" class="btn btn-primary" type="button" data-i18n="tg_connect"></button>
      </section>
    </main>

    <!-- ============ РАЗДЕЛ: БАЙЕРЫ (только админ) ============ -->
    <main id="tab-buyers" class="container hidden">
      <section class="client-block">
        <h2 data-i18n="b_invite_title"></h2>
        <p class="muted b-lead" data-i18n="b_invite_hint"></p>
        <div class="invite-row">
          <input id="invite-note" type="text" maxlength="200" data-i18n-placeholder="b_invite_note" autocomplete="off">
          <button id="invite-create" class="btn btn-primary" type="button" data-i18n="b_invite_btn"></button>
        </div>
        <div id="invite-result" class="invite-result hidden">
          <p data-i18n="b_invite_ready"></p>
          <input id="invite-link" class="link-input" type="text" readonly>
          <div class="stack stack-row">
            <button id="invite-copy" class="btn btn-primary" type="button" data-i18n="copy"></button>
            <a id="invite-wa" class="btn" target="_blank" rel="noopener" data-i18n="link_whatsapp"></a>
          </div>
        </div>
        <h3 class="b-sub" data-i18n="b_invites"></h3>
        <div id="invites" class="invites"></div>
      </section>

      <section class="assistant" aria-labelledby="as-admin-title">
        <div class="assistant-head as-static">
          <span class="as-icon" aria-hidden="true">💡</span>
          <span id="as-admin-title" class="as-title" data-i18n="as_admin_title"></span>
        </div>
        <div id="as-admin-list" class="assistant-list"></div>
      </section>

      <!-- 🤖 ИИ-помощник администратора (Google Gemini, бесплатный тариф) -->
      <section class="ai-box" aria-labelledby="ai-title">
        <div class="assistant-head as-static">
          <span class="as-icon" aria-hidden="true">🤖</span>
          <span id="ai-title" class="as-title" data-i18n="ai_title"></span>
        </div>
        <div id="ai-log" class="ai-log" aria-live="polite"></div>
        <div id="ai-examples" class="ai-examples"></div>
        <form id="ai-form" class="ai-form" novalidate>
          <textarea id="ai-input" rows="2" maxlength="2000" data-i18n-placeholder="ai_placeholder"></textarea>
          <button id="ai-send" class="btn btn-primary" type="submit" data-i18n="ai_send"></button>
        </form>
        <p class="ai-note" data-i18n="ai_note"></p>
      </section>

      <h2 class="section-title" data-i18n="b_workspaces"></h2>
      <div id="buyers-loading" class="state-box hidden" data-i18n="loading"></div>
      <div id="buyers" class="clients"></div>
    </main>

    <!-- ============ РАЗДЕЛ: КАЛЬКУЛЯТОР ВАЛЮТ ============ -->
    <main id="tab-calc" class="container container-narrow hidden">
      <section class="client-block fx">
        <h2 data-i18n="fx_title"></h2>
        <div class="fx-row">
          <label class="field fx-amount"><span data-i18n="fx_amount"></span>
            <input id="fx-amount" type="text" inputmode="decimal" value="1000"></label>
          <label class="field"><span data-i18n="fx_from"></span>
            <select id="fx-from" class="currency-select"></select></label>
          <button id="fx-swap" class="btn fx-swap" type="button" data-i18n-title="fx_swap">⇄</button>
          <label class="field"><span data-i18n="fx_to"></span>
            <select id="fx-to" class="currency-select"></select></label>
        </div>
        <div class="fx-result" aria-live="polite">
          <div id="fx-result" class="fx-big">—</div>
          <div id="fx-rate" class="muted"></div>
        </div>
        <!-- свой курс байера: сохраняется в кабинете и подставляется в новые заказы -->
        <form id="fx-my-form" class="fx-my" data-write autocomplete="off">
          <label class="field"><span id="fx-my-label"></span>
            <input id="fx-my-rate" type="text" inputmode="decimal"></label>
          <button id="fx-my-save" class="btn btn-primary" type="submit" data-i18n="fx_my_save"></button>
        </form>
        <p id="fx-market" class="fine-print"></p>
        <p id="fx-updated" class="fine-print"></p>
      </section>

      <section class="client-block">
        <h2 data-i18n="fx_my_title"></h2>
        <p class="fine-print" data-i18n="fx_my_hint"></p>
        <div id="my-rates" class="fx-table"></div>
      </section>

      <section class="client-block">
        <h2 id="fx-table-title"></h2>
        <div id="fx-table" class="fx-table"></div>
      </section>
    </main>

    <!-- ============ РАЗДЕЛ: КЛИЕНТЫ ============ -->
    <main id="tab-clients" class="container hidden">
      <section class="toolbar toolbar-clients">
        <input id="clients-search" class="search" type="search" data-i18n-placeholder="clients_search" autocomplete="off">
        <button id="clients-export" class="btn btn-primary" type="button" data-i18n="export_csv"></button>
      </section>
      <p id="clients-count" class="fine-print"></p>
      <div id="clients-loading" class="state-box hidden" data-i18n="loading"></div>
      <div id="clients" class="clients"></div>
      <div id="clients-empty" class="state-box hidden"></div>
    </main>

    <!-- ============ РАЗДЕЛ: ЗАКАЗЫ ============ -->
    <main id="tab-orders" class="container">

      <!-- Склад -->
      <section class="warehouse" aria-labelledby="wh-title">
        <div class="warehouse-text">
          <h2 id="wh-title">📍 <span data-i18n="warehouse_title"></span></h2>
          <p id="wh-address" class="warehouse-address" lang="zh-CN"></p>
          <div id="wh-contacts" class="warehouse-contacts"></div>
        </div>
        <div class="warehouse-actions">
          <button id="wh-copy" class="btn btn-light" type="button" data-i18n="copy_address"></button>
          <button id="wh-edit" class="btn btn-on-dark" type="button" data-write data-owner data-i18n="wh_edit"></button>
        </div>
      </section>

      <!-- Сводка -->
      <section class="summary" aria-label="summary">
        <div class="summary-item">
          <span class="summary-label" data-i18n="sum_orders"></span>
          <span id="sum-orders" class="summary-value">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label" data-i18n="sum_total"></span>
          <span id="sum-total" class="summary-value">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label" data-i18n="sum_paid"></span>
          <span id="sum-paid" class="summary-value paid">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label" data-i18n="sum_debt"></span>
          <span id="sum-debt" class="summary-value debt">0</span>
        </div>
        <div class="summary-item summary-profit">
          <span class="summary-label" data-i18n="sum_profit"></span>
          <span id="sum-profit" class="summary-value paid">0</span>
        </div>
      </section>
      <p class="fine-print" data-i18n="sum_note"></p>

      <!-- Умный помощник: сам находит проблемы в заказах -->
      <section id="assistant" class="assistant" aria-labelledby="as-title">
        <button id="as-toggle" class="assistant-head" type="button" aria-expanded="true">
          <span class="as-icon" aria-hidden="true">💡</span>
          <span id="as-title" class="as-title" data-i18n="as_title"></span>
          <span id="as-count" class="as-count"></span>
          <span class="as-caret" aria-hidden="true">▾</span>
        </button>
        <div id="as-list" class="assistant-list"></div>
      </section>
      <!-- активный фильтр от помощника -->
      <div id="hint-filter" class="hint-filter hidden">
        <span id="hint-filter-text"></span>
        <button id="hint-filter-clear" class="btn btn-ghost" type="button" aria-label="×">×</button>
      </div>

      <!-- Статусы: счётчики и фильтр в одном -->
      <div id="chips" class="chips" role="tablist"></div>

      <!-- Поиск и фильтр по дате -->
      <section class="toolbar">
        <input id="search" class="search" type="search" data-i18n-placeholder="search_placeholder" autocomplete="off">
        <label class="date-field">
          <span data-i18n="date_from"></span>
          <input id="date-from" type="date">
        </label>
        <label class="date-field">
          <span data-i18n="date_to"></span>
          <input id="date-to" type="date">
        </label>
        <button id="reset-filters" class="btn" type="button" data-i18n="reset"></button>
        <button id="new-order" class="btn btn-primary toolbar-new" type="button" data-write>+ <span data-i18n="new_order"></span></button>
      </section>

      <div id="loading" class="state-box hidden" data-i18n="loading"></div>
      <div id="orders" class="orders"></div>
      <div id="empty" class="state-box hidden"></div>
    </main>

    <button id="fab" class="fab" type="button" aria-label="+" data-write>+</button>
  </div>

  <!-- ============ СТРАНИЦА КЛИЕНТА ============ -->
  <div id="view-client" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><img class="brand-mark" src="img/mark.svg" alt="" width="36" height="36"><span class="brand-name"><b>ULA</b> Factory</span></div>
        <div class="client-actions">
          <button id="client-refresh" class="icon-btn gear-btn" type="button" data-i18n-title="refresh">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="ru" title="Русский">RU</button>
            <button type="button" data-lang="en" title="English">EN</button>
            <button type="button" data-lang="zh" title="中文">中文</button>
          </div>
        </div>
      </div>
    </header>
    <main id="client-content" class="container container-narrow"></main>
  </div>

  <!-- ============ ОКНО: ФОРМА ЗАКАЗА ============ -->
  <div id="modal-order" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <form id="order-form" class="modal-sheet" novalidate>
      <div class="modal-head">
        <h2 id="order-form-title"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <fieldset>
          <legend data-i18n="sec_main"></legend>
          <div class="grid-3">
            <label class="field"><span data-i18n="f_order_number"></span>
              <input id="f-order_number" type="text" readonly data-i18n-placeholder="auto_number"></label>
            <label class="field"><span data-i18n="f_date"></span>
              <input id="f-order_date" type="date" required></label>
            <label class="field"><span data-i18n="f_status"></span>
              <select id="f-status"></select></label>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="sec_client"></legend>
          <div class="grid-3">
            <label class="field"><span data-i18n="f_client"></span>
              <input id="f-client_name" type="text" required></label>
            <label class="field"><span data-i18n="f_phone"></span>
              <input id="f-client_phone" type="tel" inputmode="tel"></label>
            <label class="field"><span data-i18n="f_wechat"></span>
              <input id="f-client_wechat" type="text"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="sec_product"></legend>
          <div class="grid-2">
            <label class="field"><span data-i18n="f_product_ru"></span>
              <input id="f-product_ru" type="text" required></label>
            <label class="field"><span data-i18n="f_product_zh"></span>
              <input id="f-product_zh" type="text" lang="zh-CN"></label>
            <label class="field"><span data-i18n="f_supplier"></span>
              <input id="f-supplier" type="text"></label>
            <label class="field"><span data-i18n="f_supplier_wechat"></span>
              <input id="f-supplier_wechat" type="text" maxlength="100" autocapitalize="off" spellcheck="false"></label>
            <label class="field"><span data-i18n="f_link"></span>
              <input id="f-supplier_link" type="url" inputmode="url" placeholder="https://"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="sec_money"></legend>

          <!-- Валюты выбирает сам байер: у поставщика (USD/CNY) и для клиента -->
          <div class="grid-2">
            <label class="field"><span data-i18n="f_purchase_currency"></span>
              <select id="f-purchase_currency" class="currency-select"></select></label>
            <label class="field"><span data-i18n="f_client_currency"></span>
              <select id="f-client_currency" class="currency-select"></select></label>
          </div>

          <!-- Товар -->
          <h4 class="money-sub" data-i18n="k_goods"></h4>
          <div class="grid-3">
            <label class="field"><span data-i18n="f_qty"></span>
              <input id="f-quantity" type="text" inputmode="decimal"></label>
            <label class="field"><span id="lbl-price"></span>
              <input id="f-unit_price_cny" type="text" inputmode="decimal"></label>
            <label class="field"><span id="lbl-rate"></span>
              <input id="f-exchange_rate" type="text" inputmode="decimal"></label>
          </div>

          <!-- Доставка (карго): вес × тариф = сумма, затем перевод в валюту клиента -->
          <h4 class="money-sub" data-i18n="k_delivery"></h4>
          <div class="grid-3">
            <label class="field"><span data-i18n="f_weight"></span>
              <input id="f-weight_kg" type="text" inputmode="decimal"></label>
            <label class="field"><span data-i18n="f_delivery_currency"></span>
              <select id="f-delivery_currency" class="currency-select"></select></label>
            <label class="field"><span id="lbl-tariff"></span>
              <input id="f-delivery_tariff" type="text" inputmode="decimal"></label>
            <label class="field"><span id="lbl-delivery"></span>
              <input id="f-delivery_cost" type="text" inputmode="decimal">
              <p class="field-hint" data-i18n="f_delivery_hint"></p></label>
            <label class="field"><span id="lbl-delivery-rate"></span>
              <input id="f-delivery_rate" type="text" inputmode="decimal"></label>
          </div>

          <!-- Цена для клиента и оплата. Клиент видит только «к оплате», «оплачено», «осталось» -->
          <h4 class="money-sub" data-i18n="k_payment"></h4>
          <div class="grid-3">
            <label class="field"><span data-i18n="f_markup"></span>
              <input id="f-markup" type="text" inputmode="decimal" placeholder="15">
              <p class="field-hint" data-i18n="f_markup_hint"></p></label>
            <label class="field"><span id="lbl-client-price"></span>
              <input id="f-client_price" type="text" inputmode="decimal">
              <p class="field-hint" data-i18n="f_client_price_hint"></p></label>
            <label class="field"><span id="lbl-paid"></span>
              <input id="f-paid_amount" type="text" inputmode="decimal"></label>
          </div>

          <div class="calc" aria-live="polite">
            <div class="calc-row"><span data-i18n="c_goods_cny"></span><b id="calc-goods-cny">0</b></div>
            <div class="calc-row"><span data-i18n="c_goods_som"></span><b id="calc-goods-som">0</b></div>
            <div class="calc-row"><span data-i18n="c_delivery"></span><b id="calc-delivery">0</b></div>
            <div class="calc-row calc-cost"><span data-i18n="c_cost"></span><b id="calc-cost">0</b></div>
            <div class="calc-row calc-total"><span data-i18n="c_client_price"></span><b id="calc-total">0</b></div>
            <div class="calc-row calc-profit"><span data-i18n="c_profit"></span><b id="calc-profit">—</b></div>
            <div class="calc-row"><span data-i18n="c_paid"></span><b id="calc-paid">0</b></div>
            <div class="calc-row calc-balance"><span data-i18n="c_balance"></span><b id="calc-balance">0</b></div>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="sec_photos"></legend>
          <label class="btn btn-file">
            <input id="f-photos" type="file" accept="image/*" multiple>
            <span data-i18n="add_photos"></span>
          </label>
          <div id="photo-previews" class="photo-previews"></div>
        </fieldset>

        <fieldset>
          <legend data-i18n="sec_comments"></legend>
          <label class="field"><span data-i18n="f_delivery_info"></span>
            <textarea id="f-delivery_info" rows="2"></textarea></label>
          <label class="field"><span data-i18n="f_comment_client"></span>
            <textarea id="f-client_comment" rows="2"></textarea></label>
          <label class="field"><span data-i18n="f_comment_admin"></span>
            <textarea id="f-admin_comment" rows="3"></textarea></label>
        </fieldset>
      </div>

      <div class="modal-foot">
        <button class="btn" type="button" data-close data-i18n="cancel"></button>
        <button id="order-save" class="btn btn-primary" type="submit" data-i18n="save"></button>
      </div>
    </form>
  </div>

  <!-- ============ ОКНО: НАСТРОЙКИ КАБИНЕТА ============ -->
  <div id="modal-settings" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <form id="settings-form" class="modal-sheet" novalidate>
      <div class="modal-head">
        <h2 data-i18n="settings"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>
      <div class="modal-body settings-body">

        <!-- Внешний вид: тема и язык (применяются сразу) -->
        <section class="s-section">
          <h3 data-i18n="s_sec_look"></h3>
          <fieldset class="seg">
            <legend data-i18n="s_theme"></legend>
            <div class="seg-options seg-3">
              <label><input type="radio" name="theme" value="auto"><span data-i18n="theme_auto"></span></label>
              <label><input type="radio" name="theme" value="light"><span data-i18n="theme_light"></span></label>
              <label><input type="radio" name="theme" value="dark"><span data-i18n="theme_dark"></span></label>
            </div>
          </fieldset>
          <fieldset class="seg">
            <legend data-i18n="s_language"></legend>
            <div class="seg-options seg-3">
              <label><input type="radio" name="s-lang" value="ru"><span>Русский</span></label>
              <label><input type="radio" name="s-lang" value="en"><span>English</span></label>
              <label><input type="radio" name="s-lang" value="zh"><span>中文</span></label>
            </div>
          </fieldset>
        </section>

        <!-- Профиль -->
        <section class="s-section">
          <h3 data-i18n="s_sec_profile"></h3>
          <div class="grid-2">
            <label class="field"><span data-i18n="join_name"></span>
              <input id="p-name" type="text" maxlength="120" autocomplete="name"></label>
            <label class="field"><span data-i18n="join_phone"></span>
              <input id="p-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="+996 555 123 456"></label>
          </div>
          <label class="field"><span data-i18n="s_new_password"></span>
            <input id="p-password" type="password" autocomplete="new-password" minlength="8">
            <p class="field-hint" data-i18n="s_password_hint"></p></label>
        </section>

        <!-- Кабинет -->
        <section class="s-section" data-ws-section>
          <h3 data-i18n="s_sec_workspace"></h3>
          <div class="grid-2">
            <label class="field"><span data-i18n="s_name"></span>
              <input id="s-name" type="text" maxlength="120" required></label>
            <label class="field"><span data-i18n="s_prefix"></span>
              <input id="s-prefix" type="text" maxlength="5" autocapitalize="characters" spellcheck="false" required>
              <p class="field-hint" data-i18n="s_prefix_hint"></p></label>
          </div>
        </section>

        <!-- Склад в Китае -->
        <section class="s-section" id="s-warehouse" data-ws-section>
          <h3 data-i18n="warehouse_title"></h3>
          <label class="field"><span data-i18n="s_address"></span>
            <textarea id="s-address" rows="3" maxlength="500" lang="zh-CN"></textarea>
            <p class="field-hint" data-i18n="s_address_hint"></p></label>
          <label class="field"><span data-i18n="s_contacts"></span>
            <textarea id="s-contacts" rows="3" maxlength="500"></textarea>
            <p class="field-hint" data-i18n="s_contacts_hint"></p></label>
        </section>

        <!-- Валюты и доставка по умолчанию -->
        <section class="s-section" data-ws-section>
          <h3 data-i18n="s_sec_money"></h3>
          <div class="grid-2">
            <label class="field"><span data-i18n="s_def_purchase"></span>
              <select id="s-def-purchase" class="currency-select"></select></label>
            <label class="field"><span data-i18n="s_def_client"></span>
              <select id="s-def-client" class="currency-select"></select></label>
            <label class="field"><span data-i18n="s_def_delivery"></span>
              <select id="s-def-delivery" class="currency-select"></select></label>
            <label class="field"><span data-i18n="s_def_tariff"></span>
              <input id="s-def-tariff" type="text" inputmode="decimal"></label>
          </div>
          <p class="field-hint" data-i18n="s_currency_hint"></p>
        </section>

        <p id="settings-error" class="form-error hidden" role="alert"></p>
      </div>
      <div class="modal-foot">
        <button class="btn" type="button" data-close data-i18n="cancel"></button>
        <button id="settings-save" class="btn btn-primary" type="submit" data-i18n="s_save"></button>
      </div>
    </form>
  </div>

  <!-- ============ ОКНО: ЗАВЕРШИТЕ РЕГИСТРАЦИЮ (нужен телефон) ============ -->
  <div id="modal-onboard" class="modal modal-small" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <form id="onboard-form" class="modal-sheet" novalidate>
      <div class="modal-head"><h2 data-i18n="onboard_title"></h2></div>
      <div class="modal-body">
        <p class="muted b-lead" data-i18n="onboard_text"></p>
        <label class="field"><span data-i18n="join_phone"></span>
          <input id="o-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="+996 555 123 456" required>
          <p class="field-hint" data-i18n="cd_phone_hint"></p></label>
        <label class="field"><span data-i18n="join_ws"></span>
          <input id="o-ws" type="text" maxlength="120" autocomplete="organization"></label>
        <p id="onboard-error" class="form-error hidden" role="alert"></p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" type="button" data-onboard-logout data-i18n="logout"></button>
        <button id="onboard-save" class="btn btn-primary" type="submit" data-i18n="s_save"></button>
      </div>
    </form>
  </div>

  <!-- ============ ОКНО: КАРТОЧКА ЗАКАЗА ============ -->
  <div id="modal-detail" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 id="detail-title"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>
      <div id="detail-body" class="modal-body"></div>
    </div>
  </div>

  <!-- ============ ОКНО: СТАТУС ============ -->
  <div id="modal-status" class="modal modal-small" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 data-i18n="change_status"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>
      <div id="status-list" class="modal-body status-list"></div>
    </div>
  </div>

  <!-- ============ ОКНО: ССЫЛКА КЛИЕНТУ ============ -->
  <div id="modal-link" class="modal modal-small" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 data-i18n="link_title"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <p class="muted" data-i18n="link_hint"></p>
        <input id="link-input" class="link-input" type="text" readonly>
        <div class="stack">
          <button id="link-copy" class="btn btn-primary" type="button" data-i18n="copy"></button>
          <a id="link-wa" class="btn" target="_blank" rel="noopener" data-i18n="link_whatsapp"></a>
          <a id="link-open" class="btn" target="_blank" rel="noopener" data-i18n="link_open"></a>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ ТЕХПОДДЕРЖКА: переписка ============ -->
  <div id="modal-support" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <div>
          <h2 id="support-title"></h2>
          <p id="support-sub" class="fine-print"></p>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div id="support-log" class="support-log" aria-live="polite"></div>
        <form id="support-form" class="support-form" autocomplete="off">
          <textarea id="support-text" rows="3" maxlength="4000" data-i18n-placeholder="support_placeholder"></textarea>
          <button id="support-send" class="btn btn-primary" type="submit" data-i18n="support_send"></button>
        </form>
        <p id="support-note" class="fine-print"></p>
      </div>
    </div>
  </div>

  <!-- ============ ПРОСМОТР ФОТО ============ -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lb-close" type="button" data-lb-close aria-label="Close">×</button>
    <button class="lb-nav lb-prev" type="button" data-lb-prev aria-label="Previous">‹</button>
    <img id="lb-img" alt="">
    <button class="lb-nav lb-next" type="button" data-lb-next aria-label="Next">›</button>
    <div id="lb-count" class="lb-count"></div>
  </div>
