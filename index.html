<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#151417">
  <!-- Безопасность: скрипты только с этого сайта и Cloudflare (капча); данные — только с нашего Supabase.
       Встроенных скриптов нет — даже если кто-то вставит вредный код в текст, браузер его не выполнит. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://open.er-api.com; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- в ссылках есть секретные номера (?order=, ?xr=) — не передавать адрес страницы другим сайтам -->
  <meta name="referrer" content="no-referrer">
  <script src="js/head.js?v=20261118s"></script>
  <title>ULA Factory</title>
  <link rel="icon" href="img/mark.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <!-- Приложение на главном экране: открывается на весь экран, без строки браузера -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ULA Factory">
  <meta name="application-name" content="ULA Factory">
  <!-- Шрифты Google подключает js/head.js «в фоне» -->
  <link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=20261118s">
</head>
<body>
  <!-- Пока сайт загружается — «Загрузка…». Если браузер не справился — подсказка вместо белого экрана. -->
  <div id="boot" class="boot">
    <p id="boot-text">Загрузка… / Loading…</p>
  </div>
  <!-- Заставка при входе: знак рисуется сам, потом экран разъезжается по диагонали -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-half intro-a"></div>
    <div class="intro-half intro-b"></div>
    <i class="intro-line intro-l1"></i>
    <i class="intro-line intro-l2"></i>
    <div class="intro-mark">
      <svg viewBox="0 0 64 64">
        <g fill="none" stroke="currentColor" stroke-linecap="round">
          <path class="im-ring" pathLength="1" d="M14.5 47A22 22 0 1 1 49.5 47" stroke-width="4.2"/>
          <g stroke-width="2.4">
            <path class="im-arc im-a1" pathLength="1" d="M15 19C29 21 39 31 45 52"/>
            <path class="im-arc im-a2" pathLength="1" d="M17 15C32 17 43 28 49.5 47"/>
            <path class="im-arc im-a3" pathLength="1" d="M49 19C35 21 25 31 19 52"/>
            <path class="im-arc im-a4" pathLength="1" d="M47 15C32 17 21 28 14.5 47"/>
          </g>
        </g>
        <rect class="im-bar" x="12" y="55" width="40" height="3.2" rx="1.6" fill="#A30F1F"/>
      </svg>
      <b class="intro-name">ULA <span>Factory</span></b>
    </div>
  </div>
  <script src="js/boot.js?v=20261118s"></script>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ============ ПОДСКАЗКА: НЕ ЗАПОЛНЕН config.js ============ -->
  <main id="view-config" class="center-screen hidden">
    <div class="panel">
      <img class="logo-full" src="img/logo-full.jpg" alt="ULA Factory" width="520" height="468">
      <h1 data-i18n="config_title"></h1>
      <p id="config-text" data-i18n="config_text"></p>
    </div>
  </main>

  <!-- ============ ВХОД ============ -->
  <main id="view-login" class="center-screen auth-screen hidden">
    <aside class="auth-aside" aria-hidden="true">
      <div class="auth-aside-in">
        <img class="auth-mark" src="img/mark.svg" alt="" width="56" height="56">
        <div class="auth-brand"><b>ULA</b> Factory</div>
        <p class="auth-tag" data-i18n="auth_tag"></p>
        <ul class="auth-points">
          <li><span>1</span><b data-i18n="auth_b1"></b></li>
          <li><span>2</span><b data-i18n="auth_b2"></b></li>
          <li><span>3</span><b data-i18n="auth_b3"></b></li>
        </ul>
      </div>
    </aside>
    <form id="login-form" class="panel auth-panel" autocomplete="on">
      <img class="logo-full" src="img/logo-full.jpg" alt="ULA Factory" width="520" height="468">
      <h1 data-i18n="login_title"></h1>
      <p class="muted" data-i18n="login_hint"></p>
      <p id="login-team-note" class="team-note hidden" data-i18n="tm_login_note"></p>

      <label class="field">
        <span data-i18n="email"></span>
        <input id="login-email" type="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span data-i18n="password"></span>
        <span class="pw-wrap"><input id="login-password" type="password" autocomplete="current-password" required><button type="button" class="pw-eye" data-pw-eye aria-label="show"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
      </label>

      <div id="cf-login" class="cf-box hidden"></div>
      <p class="forgot-row"><a id="forgot-link" href="#" data-i18n="forgot_link"></a></p>
      <p id="login-error" class="form-error hidden" role="alert"></p>
      <button id="login-btn" class="btn btn-primary btn-block" type="submit" data-i18n="login_btn"></button>

      <!-- Вход через Google (кнопка появляется, если Google включён в Supabase) -->
      <div class="oauth hidden" data-oauth>
        <div class="or"><span data-i18n="or"></span></div>
        <button class="btn btn-block btn-google" type="button" data-google>
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span data-i18n="google_btn"></span>
        </button>
      </div>
      <p class="switch-auth"><span data-i18n="no_account"></span> <a href="#/join" data-i18n="signup_link"></a></p>
      <p class="legal-links"><a href="terms.html" target="_blank" rel="noopener" data-i18n="legal_terms"></a> · <a href="privacy.html" target="_blank" rel="noopener" data-i18n="legal_privacy"></a></p>

      <div class="lang-switch lang-center" role="group" aria-label="Language">
        <button type="button" data-lang="ru" title="Русский">RU</button>
        <button type="button" data-lang="en" title="English">EN</button>
        <button type="button" data-lang="zh" title="中文">中文</button>
      </div>
    </form>
  </main>

  <!-- ============ РЕГИСТРАЦИЯ БАЙЕРА ПО ПРИГЛАШЕНИЮ (#/join/КОД) ============ -->
  <main id="view-join" class="center-screen auth-screen hidden">
    <aside class="auth-aside" aria-hidden="true">
      <div class="auth-aside-in">
        <img class="auth-mark" src="img/mark.svg" alt="" width="56" height="56">
        <div class="auth-brand"><b>ULA</b> Factory</div>
        <p class="auth-tag" data-i18n="auth_tag"></p>
        <ul class="auth-points">
          <li><span>1</span><b data-i18n="auth_b1"></b></li>
          <li><span>2</span><b data-i18n="auth_b2"></b></li>
          <li><span>3</span><b data-i18n="auth_b3"></b></li>
        </ul>
      </div>
    </aside>
    <div class="panel auth-panel">
      <img class="logo-full" src="img/logo-full.jpg" alt="ULA Factory" width="520" height="468">

      <!-- проверяем приглашение -->
      <p id="join-checking" class="muted" data-i18n="loading"></p>

      <!-- приглашение недействительно -->
      <div id="join-invalid" class="hidden">
        <h1 data-i18n="join_invalid_title"></h1>
        <p class="muted" data-i18n="join_invalid_text"></p>
      </div>

      <!-- форма регистрации -->
      <form id="join-form" class="hidden" novalidate>
        <h1 data-i18n="join_title"></h1>
        <p class="muted" data-i18n="join_hint"></p>
        <label class="field"><span data-i18n="join_name"></span>
          <input id="join-name" type="text" autocomplete="name" maxlength="120" required></label>
        <label class="field"><span data-i18n="join_phone"></span>
          <input id="join-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="+996 555 123 456" required>
          <p class="field-hint" data-i18n="cd_phone_hint"></p></label>
        <label class="field"><span data-i18n="join_ws"></span>
          <input id="join-ws" type="text" autocomplete="organization" maxlength="120"></label>
        <label class="field"><span data-i18n="email"></span>
          <input id="join-email" type="email" autocomplete="email" required></label>
        <label class="field"><span data-i18n="join_password"></span>
          <span class="pw-wrap"><input id="join-password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="pw-eye" data-pw-eye aria-label="show"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
        <label class="field"><span data-i18n="password_repeat"></span>
          <input id="join-password2" type="password" autocomplete="new-password" minlength="8" required></label>
        <div id="cf-join" class="cf-box hidden"></div>
        <p id="join-error" class="form-error hidden" role="alert"></p>
        <button id="join-btn" class="btn btn-primary btn-block" type="submit" data-i18n="join_btn"></button>
        <div class="oauth hidden" data-oauth>
          <div class="or"><span data-i18n="or"></span></div>
          <button class="btn btn-block btn-google" type="button" data-google>
            <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            <span data-i18n="google_btn"></span>
          </button>
        </div>
        <p class="switch-auth"><span data-i18n="have_account"></span> <a href="./" data-i18n="login_btn"></a></p>
        <p class="legal-links" data-i18n="legal_agree"></p>
        <p class="legal-links"><a href="terms.html" target="_blank" rel="noopener" data-i18n="legal_terms"></a> · <a href="privacy.html" target="_blank" rel="noopener" data-i18n="legal_privacy"></a></p>
      </form>

      <!-- письмо отправлено -->
      <div id="join-done" class="hidden">
        <h1 data-i18n="join_done_title"></h1>
        <p id="join-done-text" class="muted"></p>
        <a class="btn btn-primary btn-block" href="./" data-i18n="login_btn"></a>
      </div>

      <div class="lang-switch lang-center" role="group" aria-label="Language">
        <button type="button" data-lang="ru" title="Русский">RU</button>
        <button type="button" data-lang="en" title="English">EN</button>
        <button type="button" data-lang="zh" title="中文">中文</button>
      </div>
    </div>
  </main>

  <!-- ============ КАБИНЕТ ============ -->
  <div id="view-admin" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><img class="brand-mark bm-on-light" src="img/mark-dark.svg" alt="" width="36" height="36"><img class="brand-mark bm-on-dark" src="img/mark.svg" alt="" width="36" height="36"><span class="brand-text"><span class="brand-name"><b>ULA</b> Factory</span></span></div>
        <div class="section-menu-wrap">

            <span id="section-menu-label" class="section-menu-label"></span>

          </button>
          <div id="section-menu" class="section-menu hidden">

            <div class="menu-group mg-more" data-group-toggle="more" role="presentation"><span data-i18n="menu_more"></span></div>
            <button type="button" class="tab" data-group="more" data-tab="quote"><i class="tab-ico" data-ico="calc"></i><span data-i18n="nav_quote"></span></button>
            <button id="vol-menu" type="button" class="tab" data-group="more" aria-haspopup="dialog"><i class="tab-ico" data-ico="box"></i><span data-i18n="nav_volume"></span></button>
            <button id="import-menu" type="button" class="tab" data-group="more" data-import-open data-write aria-haspopup="dialog"><i class="tab-ico" data-ico="file"></i><span data-i18n="im_menu"></span></button>
            <button type="button" class="tab" data-group="more" data-tab="suppliers"><i class="tab-ico" data-ico="factory"></i><span data-i18n="nav_suppliers"></span></button>
            <button type="button" class="tab" data-group="more" data-tab="shipments"><i class="tab-ico" data-ico="truck"></i><span data-i18n="nav_shipments"></span></button>
            <button type="button" class="tab admin-only" data-group="more" data-tab="buyers"><i class="tab-ico" data-ico="users"></i><span data-i18n="nav_buyers"></span></button>
            <button type="button" class="tab admin-only" data-group="more" data-tab="support"><i class="tab-ico" data-ico="message"></i><span data-i18n="nav_support"></span><span id="support-tab-badge" class="badge-inline hidden"></span></button>
            </nav>
            <div class="menu-divider" role="separator"></div>
            <button id="simple-btn" class="menu-action menu-simple hidden" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span></span></button>

            <button id="refresh-menu-btn" class="menu-action menu-refresh" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span data-i18n="refresh_menu"></span></button>
            <button id="tour-btn" class="menu-action buyer-only" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><span data-i18n="tour_btn"></span></button>
