<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ULA Factory</title>
<style>
  :root { --bg: #F2F2F7; --ink: #1D1D1F; --muted: #6E6E73; --btn: #1D1D1F; --on-btn: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #F5F5F7; --muted: #98989D; --btn: #F5F5F7; --on-btn: #000; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 17px; }
  h1 { font-size: 21px; margin: 18px 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; max-width: 300px; }
  button { border: 0; border-radius: 12px; padding: 13px 28px; font: 600 16px -apple-system, sans-serif; background: var(--btn); color: var(--on-btn); }
</style>
</head>
<body>
  <main>
    <img src="img/icon-192.png" alt="">
    <h1>Нет подключения к интернету</h1>
    <p>Проверьте Wi-Fi или мобильный интернет и попробуйте снова.<br>No internet connection.</p>
    <button type="button" onclick="location.href='https://miradio5555-code.github.io/robott/'">Повторить / Retry</button>
  </main>
</body>
</html>
