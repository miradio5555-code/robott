# Ночная копия базы и всех файлов Supabase Storage (03:00 по Бишкеку).
# Копия зашифрована; GitHub хранит её 30 дней в Actions → «Копия базы» → Artifacts.
#
# Три результата запуска:
#   ✅ зелёная галочка  — копия создана, расшифрована и проверена; в сводке запуска указан размер;
#   🔴 «КОПИРОВАНИЕ НЕ НАСТРОЕНО» — не заданы секреты, копии нет (запуск красный намеренно);
#   🔴 «ОШИБКА КОПИРОВАНИЯ»       — секреты есть, но что-то сломалось, копии нет.
#
# Включить (один раз): GitHub → репозиторий → Settings → Secrets and variables → Actions → New repository secret:
#   SUPABASE_DB_URL  — Supabase → Connect → «Session pooler» (порт 5432), строка с вашим паролем базы
#   SUPABASE_URL     — адрес проекта, заканчивается на .supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — старый секретный service_role JWT из Supabase → Settings → API Keys (начинается на eyJ)
#   BACKUP_PASSWORD  — придумайте длинный пароль и сохраните отдельно: без него копию не открыть
# Важно: service_role даёт полный доступ. Вставляйте его только в GitHub Secrets, не в код и не в чат.
#
# Внутри архива: database.dump (схемы public и auth), storage-buckets.sql, storage-policies.sql,
# папка storage/ со всеми файлами и manifest.json. Как восстановить — в BACKUP.md.
name: Копия базы

permissions:
  contents: read

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сделать и проверить копию
        id: backup
        shell: bash
        run: |
          set +e
          bash scripts/make_backup.sh "$RUNNER_TEMP/out"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Копия создана и проверена." >> "$GITHUB_STEP_SUMMARY"
            ls -lh "$RUNNER_TEMP/out" | tail -n +2 >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" -eq 78 ]; then
            echo "::error title=Копирование не настроено::Не заданы секреты Supabase/BACKUP_PASSWORD. Копия НЕ создана. Инструкция: BACKUP.md."
            echo "### 🔴 КОПИРОВАНИЕ НЕ НАСТРОЕНО — копия не создана" >> "$GITHUB_STEP_SUMMARY"
            echo "Добавьте четыре секрета (см. BACKUP.md) и запустите задачу вручную." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "::error title=Ошибка копирования::Копия НЕ создана (код $code). Смотрите журнал шага."
            echo "### 🔴 ОШИБКА КОПИРОВАНИЯ — копия не создана" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ula-db-${{ github.run_id }}
          path: ${{ runner.temp }}/out/ula-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
