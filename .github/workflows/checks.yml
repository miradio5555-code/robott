# Проверки при каждой отправке на GitHub. Результат: вкладка Actions в репозитории.
# Красный крестик — что-то сломано, письмо придёт на почту. Ничего не публикует и рабочую базу не трогает.
#   Сайт      — npm run check: синтаксис, словари, версия во всех файлах, номера файлов базы и документы,
#               статический анализ, память «приложения», шаблоны заказа, импорт, путь заказа, WhatsApp, серверные функции.
#   Приложение — копия сайта для iPhone собирается и совпадает с сайтом.
#   Экраны    — основные экраны в настоящем Chrome с поддельной базой.
#   База      — все SQL-файлы на временном Postgres + правила безопасности.
name: Проверки

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Сайт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # без Deno серверные функции нельзя проверить по-настоящему — на GitHub это ошибка, а не предупреждение
      - run: npm run check
        env:
          ULA_REQUIRE_DENO: "1"

  mobile:
    name: Приложение
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # копия для iPhone собирается одним скриптом и после сборки точно совпадает с сайтом;
      # заодно ловит файл, подключённый в index.html, но забытый в mobile/copy-web.sh
      - run: bash mobile/copy-web.sh
      - run: bash mobile/copy-web.sh --check
      - name: Копия не хранится в git
        run: |
          if [ -n "$(git ls-files mobile/www mobile/ios/App/App/public)" ]; then
            echo "❌ mobile/www и mobile/ios/App/App/public создаются скриптом и не должны лежать в git"; exit 1
          fi

  smoke:
    name: Экраны
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Экраны в Chrome
        run: |
          node tests/browser/smoke.mjs
          rc=$?
          if [ $rc = 3 ]; then echo "❌ Chrome не найден — экраны не проверены"; exit 1; fi
          exit $rc
        shell: bash {0}

  db:
    name: База
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(join(github.event.commits.*.modified, ','), '.sql') || contains(join(github.event.commits.*.added, ','), '.sql') || contains(join(github.event.commits.*.modified, ','), 'supabase/') || contains(join(github.event.commits.*.modified, ','), 'tests/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bash tests/run_db_tests.sh
